name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ts-build:
    name: TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tools/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  ts-test-headless:
    name: Headless Blender integration tests
    needs: ts-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: Tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tools/package-lock.json

      - name: Install Blender (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo snap install blender --classic --channel=4.2lts/stable || \
          sudo apt-get update && sudo apt-get install -y blender

      - name: Install Blender (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask blender

      - name: Install Blender (Windows)
        if: runner.os == 'Windows'
        run: choco install blender --version 4.2.0 -y --no-progress

      - name: Locate Blender (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          which blender || true
          blender --version || true

      - run: npm ci || npm install
      - run: npm run build
      - name: Run tool integration tests
        run: npm run test:tools
        env:
          BLENDER_PORT: "9877"
      - name: Run recipe tests
        if: success() || failure()
        run: npm run test:recipes
        env:
          BLENDER_PORT: "9877"
